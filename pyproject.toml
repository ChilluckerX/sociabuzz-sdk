[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sociabuzz"
version = "2.1.0"
description = "Reverse-engineered Python SDK & payment gateway for SociaBuzz donations. 18 countries, 100+ payment methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SociaBuzz SDK contributors" }]
keywords = ["sociabuzz", "payment", "donation", "payment-gateway", "xendit", "midtrans", "stripe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/yourusername/sociabuzz-sdk"
Documentation = "https://github.com/yourusername/sociabuzz-sdk/blob/main/docs/FEES.md"

[tool.hatch.build.targets.wheel]
packages = ["sociabuzz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
